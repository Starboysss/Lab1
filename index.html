<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dynamic Webpage</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        h1 { color: #2c3e50; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <h1>Welcome to My Dynamic Webpage</h1>
    <p id="message">This is the dynamic version with CSS and JavaScript.</p>
    <button onclick="changeText()">Click Me</button>

    <script>
        function changeText() {
            document.getElementById('message').innerText = "You clicked the button! JavaScript is working perfectly.";
        }
    </script>
</body>
</html>
